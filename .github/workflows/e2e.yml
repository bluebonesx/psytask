name: E2E Tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run build
      - uses: ./.github/actions/e2e
